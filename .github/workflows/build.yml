name: Build Desktop, Android and Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

jobs:
  build:
    name: Build (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Java
        if: matrix.os == 'ubuntu-latest'
        uses: actions/setup-java@v4
        with:
          distribution: 'zulu'
          java-version: '21'

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'npm'

      - name: Install Dependencies
        run: npm install

      - name: Build Web Assets
        run: npm run build

      - name: Build and Publish Electron
        uses: samuelmeuli/action-electron-builder@v1
        with:
          github_token: ${{ secrets.GITHUB_TOKEN }}
          release: true

      - name: Build and Sign Android APK
        if: matrix.os == 'ubuntu-latest'
        env:
          KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
          KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
          KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
        run: |
          npx cap sync android
          cd android
          echo $KEYSTORE_BASE64 | base64 -d > release.jks
          chmod +x gradlew
          ./gradlew assembleRelease \
            -Pandroid.injected.signing.store.file=$(pwd)/release.jks \
            -Pandroid.injected.signing.store.password=$KEYSTORE_PASSWORD \
            -Pandroid.injected.signing.key.alias=$KEY_ALIAS \
            -Pandroid.injected.signing.key.password=$KEY_PASSWORD

      - name: Upload Android APK
        if: matrix.os == 'ubuntu-latest'
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Garantindo existência do release $TAG..."
          gh release create "$TAG" --title "$TAG" --notes "Release $TAG" || echo "Release já existe ou está sendo criado."
          
          echo "Aguardando 10 segundos para estabilização do GitHub API..."
          sleep 10
          
          echo "Fazendo upload do APK..."
          gh release upload "$TAG" android/app/build/outputs/apk/release/*.apk --clobber

      - name: Update Release Notes
        if: matrix.os == 'windows-latest'
        shell: bash
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG=${GITHUB_REF#refs/tags/}
          echo "Garantindo que o release $TAG existe..."
          gh release create "$TAG" --title "$TAG" --notes "Draft release for $TAG" || true
          
          PREVIOUS_TAG=$(git describe --tags --abbrev=0 $TAG^ 2>/dev/null || echo "")
          
          if [ -n "$PREVIOUS_TAG" ]; then
            MESSAGE=$(git log "$PREVIOUS_TAG..$TAG" --grep="^release:" -1 --pretty=format:"%B")
          else
            MESSAGE=$(git log "$TAG" --grep="^release:" -1 --pretty=format:"%B")
          fi
          
          if [ -z "$MESSAGE" ]; then
            MESSAGE=$(git log -1 --pretty=format:"%B")
          fi
          
          echo "$MESSAGE" > release_notes.md
          echo "" >> release_notes.md
          if [ -n "$PREVIOUS_TAG" ]; then
            echo "**Full Changelog**: https://github.com/${{ github.repository }}/compare/$PREVIOUS_TAG...$TAG" >> release_notes.md
          fi
          
          echo "Atualizando notas do release $TAG..."
          gh release edit "$TAG" --notes-file release_notes.md
